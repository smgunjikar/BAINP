<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BAINP · FastAPI Demo</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#26364d;background:#f2f5fa}*{box-sizing:border-box}body{margin:0}.frame{display:flex;min-height:100vh}.sidebar{width:245px;background:#132742;padding:30px 18px;color:white;display:flex;flex-direction:column}.logo{font-size:25px;font-weight:800;line-height:1}.logo span{font-size:11px;font-weight:600;letter-spacing:1.5px;color:#9aafc9}.subnav{font-size:11px;letter-spacing:2px;color:#9aafc9;margin:50px 0 17px}button{cursor:pointer}.tab{border:0;background:transparent;color:#ccd9e9;padding:14px;margin-bottom:7px;text-align:left;border-radius:10px;width:100%}.tab.active{background:#29517d;color:white}.foot{margin-top:auto;font-size:11px;line-height:1.6;color:#9eb2ca}.main{flex:1;min-width:0;max-width:1150px;padding:42px 45px;margin:0 auto}.eyebrow{font-size:12px;font-weight:800;letter-spacing:2px;color:#4870af}h1{margin:6px 0;font-size:34px;letter-spacing:-.8px}h2{font-size:20px;margin:0 0 12px}h3{margin:0 0 10px}.muted{color:#67778b;line-height:1.65}.badge{background:#e5efff;color:#1c559f;border-radius:40px;padding:9px 14px;font-size:12px;font-weight:700;display:inline-block}.header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:32px}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:18px}.tile,.panel{background:white;border:1px solid #dce5ee;border-radius:16px;padding:24px;box-shadow:0 5px 22px #122c4110}.tile strong{display:block;font-size:35px;margin:10px 0}.tile small{font-size:12px;color:#64758b}.panel{margin-bottom:18px}.flow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.flow span{background:#eff5ff;border-radius:10px;padding:12px;font-size:13px;color:#2a5795;font-weight:650}.cta{background:#275fd6;border:none;color:white;border-radius:10px;padding:12px 17px;font-weight:700}.secondary{background:white;color:#2d517c;border:1px solid #b9cbe0;border-radius:10px;padding:11px 17px}.task{display:flex;flex-direction:column;align-items:center;gap:16px;padding:24px;background:#f2f7fe;border-radius:12px}.stimulus{font-size:105px;font-weight:750}.casegrid{display:grid;grid-template-columns:1fr 1.4fr;gap:18px}.casebutton{width:100%;text-align:left;padding:12px;border-radius:10px;border:0;background:#f5f8fc;margin:4px 0;color:#2b4360}.casebutton.active{background:#e3edfc;color:#2354a2;font-weight:800}.result{background:#f0f5ff;border:1px solid #c5d8f2;border-radius:11px;padding:17px}.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:13px 0;border-top:1px solid #e3e9ef}.row span{color:#718195;font-size:12px}select{padding:10px;border:1px solid #c2cedd;border-radius:9px;width:100%;margin-top:8px}.notice{padding:14px;background:#e5f0ff;border-radius:9px;color:#26598c;margin:14px 0}.error{background:#ffedec;color:#993333}footer{margin-top:36px;color:#8a98aa;font-size:12px}@media(max-width:760px){.frame{display:block}.sidebar{width:auto;min-height:unset;padding:18px;display:block}.subnav,.foot{display:none}.logo{font-size:18px;margin-bottom:12px}.tab{width:auto;padding:8px;font-size:12px}.main{padding:24px 14px}.tiles,.casegrid{grid-template-columns:1fr}.header{display:block}h1{font-size:27px}}
</style></head><body><div class="frame"><aside class="sidebar"><div class="logo">◉ BAINP<br><span>NEXUS / RESEARCH</span></div><div class="subnav">WORKSPACE</div><button class="tab active" data-tab="overview">▦ Overview</button><button class="tab" data-tab="assessment">◎ Cognitive Lab</button><button class="tab" data-tab="research">⌁ Research Streams</button><button class="tab" data-tab="care">♡ CareLoop</button><div class="foot">v1.0 · RESEARCH DEMO<br>NO REAL PATIENT DATA</div></aside><main class="main"><div class="header"><div><div class="eyebrow">BRAIN HEALTH INTELLIGENCE</div><h1 id="title">Research control center</h1><div class="muted">Evidence-aware observation to action · Not a diagnostic device</div></div><div class="badge">● Synthetic environment</div></div><div id="message" aria-live="polite"></div><div id="content"></div><footer>BAINP · Fictional cases · No medically validated risk prediction.</footer></main></div><script>
let tab='overview',cases=[],timeline={sessions:[]},selected='functional',index=0,trials=[],started=0;
const stimuli=['B','A','C','B','A','B','C','A'];
const titles={overview:'Research control center',assessment:'Cognitive measurement lab',research:'Independent research tracks',care:'CareLoop review workspace'};
const $=q=>document.querySelector(q);
function notice(t,bad=false){$('#message').innerHTML=t?`<div class="notice ${bad?'error':''}">${escapeHtml(t)}</div>`:''}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function call(path,opts){const response=await fetch(path,{...opts,headers:{'Content-Type':'application/json'}});if(!response.ok)throw Error(`${response.status}: ${await response.text()}`);return response.json()}
async function load(){try{[cases,timeline]=await Promise.all([call('/v1/demo/cases'),call('/v1/demo/timeline')]);render()}catch(e){notice('API error '+e.message,true)}}
function view(t){tab=t;$('.tab.active')?.classList.remove('active');document.querySelector(`[data-tab="${t}"]`).classList.add('active');notice('');render()}
document.querySelectorAll('[data-tab]').forEach(el=>el.addEventListener('click',()=>view(el.dataset.tab)));
function render(){
 $('#title').textContent=titles[tab];let html='';
 if(tab==='overview'){html=`<div class="tiles"><div class="tile"><small>SYNTHETIC SCENARIOS</small><strong>${cases.length}</strong><small>Data-quality and safety examples</small></div><div class="tile"><small>STORED TASK SESSIONS</small><strong>${timeline.sessions.length}</strong><small>SQLite persistence</small></div><div class="tile"><small>INDEPENDENT DATASET TRACKS</small><strong>3</strong><small>MRI, wrist motion, EEG</small></div></div><div class="panel"><h2>Signal-to-care intelligence</h2><p class="muted">Observe and store → validate data quality → describe change → communicate uncertainty → support qualified review and follow-up.</p><div class="flow"><span>Acquire</span>→<span>Validate</span>→<span>Interpret cautiously</span>→<span>Review</span>→<span>Follow up</span></div></div><div class="panel"><h2>Research integrity</h2><p class="muted">OASIS, PADS and OpenNeuro data originate from different studies. They must never be combined as though they represent one real person's measurements. Real research analyses are not yet run in this demo.</p></div>`}
 if(tab==='assessment'){html=`<div class="panel"><h2>Experimental target detection</h2><p class="muted">Press Target for letter A; press Skip for every other letter. Eight trials are recorded. This is a software demonstration, not a validated screening test.</p><div id="taskarea"><button class="cta" onclick="begin()">Start task</button></div></div><div class="panel"><h2>Stored sessions</h2>${timeline.sessions.length?timeline.sessions.map(s=>`<div class="row"><b>${s.correct}/8 correct</b><span>${escapeHtml(s.recorded_at)}</span><span>${escapeHtml(s.quality_status)}</span></div>`).join(''):'<p class="muted">No sessions recorded yet.</p>'}</div>`}
 if(tab==='research'){html='<div class="tiles">'+[['OASIS-1 / OASIS-2','Authorized local MRI studies. Imaging analysis pending.'],['PADS / Wrist sensors','Separate participant-held-out research dataset. Analysis pending.'],['OpenNeuro / EEG','Resting neural signals; cross-sectional disease-group study. Analysis pending.']].map(([a,b])=>`<div class="tile"><h3>${a}</h3><p class="muted">${b}</p></div>`).join('')+'</div><div class="panel"><h2>NeuroPulse and NeuroTwin</h2><p class="muted">Live EEG, ear-EEG, wearable sync, predictive trajectories and clinical biofluid analyses are future research modules. The current repository documents their data contracts and safety boundaries.</p></div>'}
 if(tab==='care'){const c=cases.find(x=>x.id===selected)||cases[0];html=`<div class="casegrid"><div class="panel"><h2>Fictional scenarios</h2>${cases.map(x=>`<button class="casebutton ${x.id===c?.id?'active':''}" onclick="pick('${x.id}')">${escapeHtml(x.title)}</button>`).join('')}</div><div class="panel">${c?`<h2>${escapeHtml(c.title)}</h2><p class="muted">${escapeHtml(c.summary)}</p><div class="result"><small>RESEARCH DEMO STATUS</small><h3>${escapeHtml(c.interpretation.status.replaceAll('_',' '))}</h3><p>${escapeHtml(c.interpretation.reason)}</p></div><p class="muted">No medical diagnosis generated. This is a synthetic workflow case.</p><label for="carestatus">Follow-up status</label><select id="carestatus" onchange="setCare(this.value)">${['not_started','review_pending','reviewed','follow_up_planned','closed_demo'].map(s=>`<option value="${s}" ${s===c.care_status?'selected':''}>${escapeHtml(s.replaceAll('_',' '))}</option>`).join('')}</select>`:''}</div></div>`}
 $('#content').innerHTML=html;
}
function begin(){index=0;trials=[];showTrial()}
function showTrial(){started=performance.now();$('#taskarea').innerHTML=`<div class="task"><div class="eyebrow">TRIAL ${index+1}/8</div><div class="stimulus">${stimuli[index]}</div><div><button class="cta" onclick="answer(true)">Target (A)</button> <button class="secondary" onclick="answer(false)">Skip</button></div></div>`}
async function answer(pressed){trials.push({index,stimulus:stimuli[index],pressed,response_ms:pressed?Math.round(performance.now()-started):null});index++;if(index<8){showTrial();return}$('#taskarea').innerHTML='<p class="muted">Saving trial-level data…</p>';try{const r=await call('/v1/demo/attention',{method:'POST',body:JSON.stringify({trials})});notice(`Saved session: ${r.correct}/${r.total} correct, ${r.quality_status}. No diagnosis.`);await load()}catch(e){notice(e.message,true)}}
function pick(id){selected=id;render()}
async function setCare(status){try{await call(`/v1/demo/cases/${selected}/care`,{method:'PUT',body:JSON.stringify({status})});notice('Saved synthetic care status.');await load()}catch(e){notice(e.message,true)}}
load();
</script></body></html>
