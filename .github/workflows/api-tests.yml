name: API and ADNI Inventory Tests
on:
  push:
  pull_request:
jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r apps/api/requirements.txt
      - run: python -m pytest apps/api/tests research/adni/tests -q
